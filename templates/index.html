<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rahasia 🤫</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#ff9ecf,#ffd6e7);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    width:360px;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,.2);
}

h2{
    margin-bottom:25px;
    color:#5393ed;
}

button{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:none;
    border-radius:12px;
    font-size:17px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:scale(1.03);
}

.a{background:#4CAF50;color:white;}
.b{background:#f2e52c;color:white;}
.c{background:#FF9800;color:white;}
.d{background:#F44336;color:white;}
</style>
</head>

<body>

<div class="card">

<h2>Do you wanna play with me?</h2>

<form action="/jawab" method="POST">
    <button class="a" type="submit">A. Yes</button>
    <button class="b" type="submit">B. Iya</button>
    <button class="c" type="submit">C. Mau</button>
    <button class="d" type="submit">D. Gasss</button>
</form>

</div>

</body>
</html>
